name: schaw_cafe
description: "A modern Mobile POS for Schaw Cafe powered by Flutter & Supabase."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  print_bluetooth_thermal: ^1.2.4
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  bcrypt: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
